# Gateway / bastión: nombre estable meta.dfsha.internal, TLS 1.3 hacia el cliente y balanceo hacia los 3 MDS.
# Un MDS que no es líder responde 307 NOT_LEADER con Location = URL directa del líder (método y cuerpo se conservan);
# NGINX deja pasar ese 307 y el cliente sigue directo al líder (las VM cliente deben alcanzar el puerto 8443 de los MDS).
# Solo se reintenta en otro upstream ante error de conexión o timeout, nunca ante una respuesta HTTP: así un
# 503 INSUFFICIENT_REPLICAS real llega intacto al cliente y ningún POST se ejecuta dos veces.
events {}
http {
  upstream mds {
    server MDS1_IP:8443; server MDS2_IP:8443; server MDS3_IP:8443;
  }
  server {
    listen 443 ssl;
    server_name meta.dfsha.internal;
    ssl_certificate     /etc/nginx/certs/node.pem;
    ssl_certificate_key /etc/nginx/certs/node.key;
    ssl_protocols TLSv1.3;
    client_max_body_size 4m;
    location / {
      proxy_pass https://mds;
      proxy_ssl_trusted_certificate /etc/nginx/certs/ca.pem;
      proxy_ssl_verify on;
      proxy_ssl_name mds.dfsha.internal;     # SAN común de los 3 certificados de MDS
      proxy_ssl_protocols TLSv1.3;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
  }
}
